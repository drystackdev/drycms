<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>DryCMS</title>
  </head>
  <body class="dry">
    <!-- Applies the stored theme before first paint to avoid a flash. Reads
         the same `drycms:store` entry's `theme` key that `useStore("theme", ...)`
         (see ThemeToggle) and `components/theme.ts` read/write - "drycms:store"
         is duplicated as a literal here (this inline script can't import the
         shared STORAGE_KEY constant) so it must be kept in sync by hand. -->
    <script>
      try {
        var store = JSON.parse(localStorage.getItem("drycms:store") || "{}");
        var stored = store.theme;
        if (stored === "light" || stored === "dark") {
          document.body.classList.add(stored);
        }
      } catch (e) {}
    </script>

    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
